name: Validate Vercel application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node tests/email-auth.mjs && node tests/password-reset.mjs && node tests/database.mjs && node tests/vercel-files.mjs && node tests/free-access.mjs && node tests/learning-routes.mjs && node tests/message-workspace.mjs && node tests/learning-upgrade.mjs && node tests/new-learning-tools.mjs && node tests/language-api.mjs && node tests/audio-transcription.mjs && node tests/progress.mjs && node tests/scanning.mjs && node tests/readability.mjs
      - run: pnpm build
