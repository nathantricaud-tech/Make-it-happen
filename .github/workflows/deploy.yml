name: Deploy Make it happen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check hosting configuration
        id: hosting
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_D1_ID" && -n "$CLOUDFLARE_R2_BUCKET" && -n "$APP_ORIGIN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source validation only. Configure Cloudflare secrets and variables to enable publication."
          fi
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: steps.hosting.outputs.ready == 'true'
        run: node scripts/configure-deployment.mjs
      - run: pnpm exec tsc --noEmit
      - run: node tests/email-auth.mjs && node tests/password-reset.mjs && node tests/free-access.mjs
      - run: pnpm build
      - if: steps.hosting.outputs.ready == 'true'
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - if: steps.hosting.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
